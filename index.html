function policyHTML(){return `
<h2>Azure Policy</h2>
<p><b>O que é:</b> um serviço que define regras sobre como os recursos podem ser criados e configurados. <b>Por que existe:</b> para garantir padrões de segurança, custo e localização, mesmo quando muitas pessoas e pipelines criam recursos.</p>

<div class="note"><b>Diferença essencial:</b><br>
<b>Azure RBAC</b> = "QUEM pode fazer?"<br>
<b>Azure Policy</b> = "O QUE pode ser criado/configurado?"</div>

<h3>Fluxo visual</h3>
<pre>
Developer
    ↓
Terraform
    ↓
Azure
    ↓
Azure Policy
    ├── Permitido → Resource criado
    └── Bloqueado → Deploy negado
</pre>

<h3>Conceitos</h3>
<table>
<tr><th>Conceito</th><th>Explicação</th></tr>
<tr><td>Policy Definition</td><td>A regra em si, escrita em JSON (ex.: "exigir tag X").</td></tr>
<tr><td>Assignment</td><td>A aplicação da regra a um escopo (Management Group, Subscription ou RG).</td></tr>
<tr><td>Initiative</td><td>Um conjunto de definições agrupadas, por exemplo "padrões de segurança".</td></tr>
<tr><td>Compliance</td><td>O painel que mostra quais recursos cumprem ou violam as regras.</td></tr>
</table>

<h3>Efeitos (o que a policy faz)</h3>
<table>
<tr><th>Efeito</th><th>Ação</th><th>Quando usar</th></tr>
<tr><td>Audit</td><td>Registra a violação, sem bloquear.</td><td>Descobrir o cenário atual antes de impor regras.</td></tr>
<tr><td>Deny</td><td>Bloqueia a criação ou alteração.</td><td>Regras obrigatórias (ex.: região permitida).</td></tr>
<tr><td>Modify</td><td>Altera o recurso durante a criação (ex.: adiciona tag).</td><td>Corrigir automaticamente propriedades.</td></tr>
<tr><td>DeployIfNotExists</td><td>Cria um recurso complementar se ele não existir.</td><td>Ex.: habilitar diagnóstico em todo recurso.</td></tr>
</table>
<p>Ordem de uso recomendada: começar com <b>Audit</b>, analisar o Compliance e só depois mudar para <b>Deny</b>.</p>

<h3>Exemplos práticos</h3>
<div class="grid">
<div class="card"><b>Tag obrigatória</b><p>"Todas as VMs devem possuir a tag <i>owner</i>." Efeito: Deny ou Modify.</p></div>
<div class="card"><b>Região restrita</b><p>"Recursos não podem ser criados fora de Brazil South." Efeito: Deny.</p></div>
<div class="card"><b>Storage privado</b><p>"Storage não pode permitir acesso público." Efeito: Deny.</p></div>
<div class="card"><b>Configuração de segurança</b><p>"Recursos devem ter diagnóstico habilitado." Efeito: DeployIfNotExists.</p></div>
</div>

<h3>Onde se encaixa com Terraform</h3>
<p>Quando o Terraform envia um <i>apply</i>, o Azure avalia cada recurso contra as policies do escopo. Se houver Deny, o erro aparece no plano de execução e o recurso não é criado. Por isso, boas práticas de IaC e Policy andam juntas: o código define o padrão e a Policy garante que ele seja cumprido.</p>
`}

function tfHTML(){return `
<h2>Terraform / Infrastructure as Code</h2>
<p><b>IaC</b> é descrever a infraestrutura em arquivos de código versionados. Em vez de clicar no portal, você declara o que deve existir e a ferramenta cria, altera ou remove os recursos para que a nuvem reflita esse código. <b>Terraform</b> é a ferramenta mais usada para isso, com suporte a várias nuvens.</p>

<h3>Ciclo de vida</h3>
<pre>
Código .tf
   ↓  terraform init     (baixa providers, configura backend)
   ↓  terraform plan     (compara código × state × nuvem)
   ↓  terraform apply    (executa as mudanças e atualiza o state)
   ↓  terraform destroy  (remove o que está no state)
</pre>

<h3>Blocos principais</h3>
<table>
<tr><th>Bloco</th><th>Função</th></tr>
<tr><td>provider</td><td>Conecta o Terraform a uma plataforma (ex.: azurerm).</td></tr>
<tr><td>resource</td><td>Um recurso que você quer criar (ex.: VNet, VM).</td></tr>
<tr><td>variable</td><td>Entrada parametrizável (ex.: região, nome do ambiente).</td></tr>
<tr><td>locals</td><td>Valores calculados internamente, para não repetir código.</td></tr>
<tr><td>output</td><td>Valores exportados após o apply (ex.: IP de um recurso).</td></tr>
<tr><td>module</td><td>Um pacote reutilizável de recursos, como uma função.</td></tr>
</table>

<h3>Como os blocos se conectam</h3>
<pre>
variables.tf ──→ main.tf (resources) ──→ outputs.tf
                      ↑
                   locals
                      ↑
                 modules/ (reutilizáveis)
</pre>

<h3>State e Backend</h3>
<pre>
Código .tf  ◄──────── compara ────────►  state (terraform.tfstate)
                                              │
                                              ▼
                                       Recursos reais na Azure

Backend local  → state no seu computador (arriscado em equipe)
Backend remoto → state no Azure Storage, com lock (seguro e compartilhado)
</pre>
<div class="note"><b>Remote State:</b> guardar o state em um backend remoto permite que o time inteiro use a mesma visão da infraestrutura, e o <i>lock</i> impede que duas pessoas apliquem ao mesmo tempo.</div>

<h3>Conceitos complementares</h3>
<ul>
<li><b>Dependencies:</b> o Terraform monta um grafo de dependências. Ex.: a Subnet só é criada depois da VNet.</li>
<li><b>Import:</b> traz para o state um recurso que já existe na nuvem, sem recriá-lo.</li>
<li><b>Workspaces:</b> mantêm states separados para ambientes diferentes (dev, staging, prod) com o mesmo código.</li>
</ul>
`}

function render() {

  let c = '<a href="#home">Início</a>';

  document.querySelectorAll('pre').forEach(pre => {

      const content = pre.innerHTML;
      pre.innerHTML = `<code class="language-plaintext">${content}</code>`;
    }

    btn.innerText = 'Copiar';
    btn.onclick = () => {
      const codeText = pre.querySelector('code').innerText;
      navigator.clipboard.writeText(codeText.trim());
      btn.innerText = 'Copiado!';
      setTimeout(() => btn.innerText = 'Copiar', 2000);
    };
    pre.appendChild(btn);
  });

  // 2. Aplicar coloração
  hljs.highlightAll();

  // 3. Sistema de Progresso
  if (k !== 'home') {
    const storageKey = 'index_done_' + k;
    const btnDone = document.createElement('button');
    const isDone = localStorage.getItem(storageKey);
    
    btnDone.className = 'btn-done ' + (isDone ? 'active' : '');
    btnDone.innerText = isDone ? '✅ Módulo Concluído' : 'Marcar como Concluído';
    
    btnDone.onclick = () => {
      if (localStorage.getItem(storageKey)) {
        localStorage.removeItem(storageKey);
        btnDone.className = 'btn-done';
        btnDone.innerText = 'Marcar como Concluído';
      } else {
        localStorage.setItem(storageKey, 'true');
        btnDone.className = 'btn-done active';
        btnDone.innerText = '✅ Módulo Concluído';
      }
      updateProgressTicks();
    };
    $('#view').appendChild(btnDone);
  }
  updateProgressTicks();
}

function updateProgressTicks() {
  document.querySelectorAll('.side nav a[data-r]').forEach(a => {
    const key = a.dataset.r;
    a.innerHTML = a.innerHTML.replace(' ✅', '');
    if (localStorage.getItem('index_done_' + key)) {
      a.innerHTML += ' ✅';
    }
  });
}

window.addEventListener('hashchange',render);

$('#q').addEventListener('input',e=>{
  const t=e.target.value.trim().toLowerCase();
  const box=$('#res');
  if(!t){box.innerHTML='';return;}
  const hits=IDX.filter(i=>(i.t+' '+i.k).toLowerCase().includes(t));
  box.innerHTML=hits.length?hits.map(h=>`<a href="#${h.r}">${h.t}</a>`).join(''):'<p style="font-size:13px;color:var(--mut)">Nenhum resultado.</p>';
});

render();
</script>
</body>
</html>
